name: Build Satyam Study Planner

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate App Files Automatically
        run: |
          mkdir -p SatyamApp/app/src/main/java/com/satyam/studyplanner
          mkdir -p SatyamApp/app/src/main/res/layout
          mkdir -p SatyamApp/app/src/main/res/values

          # 0. Gradle Properties (Fixes the AndroidX error)
          cat << 'EOF' > SatyamApp/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 1. Settings Gradle
          cat << 'EOF' > SatyamApp/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SatyamStudyPlanner"
          include(":app")
          EOF

          # 2. Project Build Gradle
          cat << 'EOF' > SatyamApp/build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 3. App Build Gradle
          cat << 'EOF' > SatyamApp/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.satyam.studyplanner"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.satyam.studyplanner"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
          }
          EOF

          # 4. Android Manifest
          cat << 'EOF' > SatyamApp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Strings (App Name)
          cat << 'EOF' > SatyamApp/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Satyam ji ka study planner</string>
          </resources>
          EOF

          # 6. Layout XML (UI Design)
          cat << 'EOF' > SatyamApp/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#0F172A"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Satyam ji ka study planner"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp"/>

              <TextView
                  android:id="@+id/timerText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="25:00"
                  android:textColor="#38BDF8"
                  android:textSize="64sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp"/>

              <Button
                  android:id="@+id/startBtn"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="Start Focus Session"
                  android:textSize="18sp"
                  android:backgroundTint="#2563EB"/>

          </LinearLayout>
          EOF

          # 7. Kotlin Code (Timer Logic)
          cat << 'EOF' > SatyamApp/app/src/main/java/com/satyam/studyplanner/MainActivity.kt
          package com.satyam.studyplanner

          import android.os.Bundle
          import android.os.CountDownTimer
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var timerText: TextView
              private lateinit var startBtn: Button
              private var countDownTimer: CountDownTimer? = null
              private var isRunning = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  timerText = findViewById(R.id.timerText)
                  startBtn = findViewById(R.id.startBtn)

                  startBtn.setOnClickListener {
                      if (!isRunning) {
                          startTimer()
                      } else {
                          stopTimer()
                      }
                  }
              }

              private fun startTimer() {
                  countDownTimer = object : CountDownTimer(25 * 60 * 1000L, 1000L) {
                      override fun onTick(millisUntilFinished: Long) {
                          val minutes = millisUntilFinished / 1000 / 60
                          val seconds = (millisUntilFinished / 1000) % 60
                          timerText.text = String.format("%02d:%02d", minutes, seconds)
                      }

                      override fun onFinish() {
                          timerText.text = "00:00"
                          startBtn.text = "Start Focus Session"
                          isRunning = false
                      }
                  }.start()

                  startBtn.text = "Pause / Reset"
                  isRunning = true
              }

              private fun stopTimer() {
                  countDownTimer?.cancel()
                  timerText.text = "25:00"
                  startBtn.text = "Start Focus Session"
                  isRunning = false
              }
          }
          EOF

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          cd SatyamApp
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: satyam-study-planner-apk
          path: SatyamApp/app/build/outputs/apk/debug/*.apk
