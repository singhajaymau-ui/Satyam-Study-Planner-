name: Build Satyam Study Planner Full Suite

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Full Regain-Style Architecture
        run: |
          mkdir -p SatyamApp/app/src/main/java/com/satyam/studyplanner/ui
          mkdir -p SatyamApp/app/src/main/java/com/satyam/studyplanner/service
          mkdir -p SatyamApp/app/src/main/res/layout
          mkdir -p SatyamApp/app/src/main/res/values
          mkdir -p SatyamApp/app/src/main/res/xml

          # 0. Gradle Properties
          cat << 'EOF' > SatyamApp/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.jvm.target.validation.mode=ignore
          EOF

          # 1. Settings Gradle
          cat << 'EOF' > SatyamApp/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SatyamStudyPlanner"
          include(":app")
          EOF

          # 2. Project Build Gradle
          cat << 'EOF' > SatyamApp/build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 3. App Build Gradle with Full Dependencies
          cat << 'EOF' > SatyamApp/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.satyam.studyplanner"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.satyam.studyplanner"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.cardview:cardview:1.0.0")
          }
          EOF

          # 4. Android Manifest with Accessibility & Usage Permissions
          cat << 'EOF' > SatyamApp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.AppBlockerAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          # 5. Accessibility Config
          cat << 'EOF' > SatyamApp/app/src/main/res/xml/accessibility_service_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:notificationTimeout="100" />
          EOF

          # 6. Strings
          cat << 'EOF' > SatyamApp/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Satyam ji ka study planner</string>
          </resources>
          EOF

          # 7. Dashboard & Timer Layout UI (Regain Style)
          cat << 'EOF' > SatyamApp/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090D16">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <!-- Header Title -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Satyam ji ka study planner"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="16dp"/>

                  <!-- Focus Timer Card -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardBackgroundColor="#131D31"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="0dp"
                      android:layout_marginBottom="16dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:gravity="center"
                          android:padding="24dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="DEEP FOCUS SESSION"
                              android:textColor="#38BDF8"
                              android:textSize="12sp"
                              android:letterSpacing="0.1"
                              android:textStyle="bold"
                              android:layout_marginBottom="12dp"/>

                          <TextView
                              android:id="@+id/timerText"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="25:00"
                              android:textColor="#FFFFFF"
                              android:textSize="56sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="20dp"/>

                          <Button
                              android:id="@+id/startBtn"
                              android:layout_width="match_parent"
                              android:layout_height="54dp"
                              android:text="Start Focus Session"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              app:cornerRadius="12dp"
                              android:backgroundTint="#2563EB"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- Screen Time & Blocker Status Card -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardBackgroundColor="#131D31"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="0dp"
                      android:layout_marginBottom="16dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="20dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Distraction Shield &amp; Blocker"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="8dp"/>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Shorts, Reels &amp; Unapproved Apps Protection active."
                              android:textColor="#94A3B8"
                              android:textSize="13sp"
                              android:layout_marginBottom="16dp"/>

                          <Button
                              android:id="@+id/permissionBtn"
                              android:layout_width="match_parent"
                              android:layout_height="48dp"
                              android:text="Enable Accessibility Shield"
                              android:textSize="14sp"
                              app:cornerRadius="10dp"
                              android:backgroundTint="#334155"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

                  <!-- Strict Mode Panel -->
                  <androidx.cardview.widget.CardView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      app:cardBackgroundColor="#131D31"
                      app:cardCornerRadius="16dp"
                      app:cardElevation="0dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="20dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Strict Mode Status"
                              android:textColor="#FFFFFF"
                              android:textSize="16sp"
                              android:textStyle="bold"
                              android:layout_marginBottom="8dp"/>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Locks app settings and prevents exits during active focus rounds."
                              android:textColor="#94A3B8"
                              android:textSize="13sp"/>
                      </LinearLayout>
                  </androidx.cardview.widget.CardView>

              </LinearLayout>
          </ScrollView>
          EOF

          # 8. Main Activity Logic
          cat << 'EOF' > SatyamApp/app/src/main/java/com/satyam/studyplanner/MainActivity.kt
          package com.satyam.studyplanner

          import android.content.Intent
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var timerText: TextView
              private lateinit var startBtn: Button
              private lateinit var permissionBtn: Button
              private var countDownTimer: CountDownTimer? = null
              private var isRunning = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  timerText = findViewById(R.id.timerText)
                  startBtn = findViewById(R.id.startBtn)
                  permissionBtn = findViewById(R.id.permissionBtn)

                  startBtn.setOnClickListener {
                      if (!isRunning) {
                          startTimer()
                      } else {
                          stopTimer()
                      }
                  }

                  permissionBtn.setOnClickListener {
                      val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      startActivity(intent)
                      Toast.makeText(this, "Enable Satyam Study Planner Accessibility", Toast.LENGTH_LONG).show()
                  }
              }

              private fun startTimer() {
                  countDownTimer = object : CountDownTimer(25 * 60 * 1000L, 1000L) {
                      override fun onTick(millisUntilFinished: Long) {
                          val minutes = millisUntilFinished / 1000 / 60
                          val seconds = (millisUntilFinished / 1000) % 60
                          timerText.text = String.format("%02d:%02d", minutes, seconds)
                      }

                      override fun onFinish() {
                          timerText.text = "00:00"
                          startBtn.text = "Start Focus Session"
                          isRunning = false
                          Toast.makeText(this@MainActivity, "Focus Session Complete! Great job, Satyam ji.", Toast.LENGTH_LONG).show()
                      }
                  }.start()

                  startBtn.text = "Pause / Cancel Session"
                  isRunning = true
                  Toast.makeText(this, "Strict Focus Shield Activated!", Toast.LENGTH_SHORT).show()
              }

              private fun stopTimer() {
                  countDownTimer?.cancel()
                  timerText.text = "25:00"
                  startBtn.text = "Start Focus Session"
                  isRunning = false
              }
          }
          EOF

          # 9. Accessibility Service Background Stub
          cat << 'EOF' > SatyamApp/app/src/main/java/com/satyam/studyplanner/service/AppBlockerAccessibilityService.kt
          package com.satyam.studyplanner.service

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent

          class AppBlockerAccessibilityService : AccessibilityService() {
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Core monitor for filtering feed nodes (Shorts / Reels)
              }

              override fun onInterrupt() {}
          }
          EOF

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        run: |
          cd SatyamApp
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: satyam-study-planner-apk
          path: SatyamApp/app/build/outputs/apk/debug/*.apk
